[[deps]]
compiler-inputs = []
package = "earthkit-data"
python-version-input = "python-version"
ref = "develop"
repo = "ecmwf/earthkit-data"

# A pure-Python upstream, built on the GitHub runner rather than in this container.
[[deps]]
build-type-input = "python-build-type"
compiler-inputs = []
package = "earthkit-utils"
platform-input = "python-platform"
python-version-input = "python-version"
ref = "develop"
repo = "ecmwf/earthkit-utils"

[matrix.test]
triggers = ["upstream-change", "rebuild-request"]

# The container and compiler of the eccodes, odc, and fdb builds that earthkit-data loads.
[matrix.test.defaults]
build-type = "RelWithDebInfo"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13-boost-qt6-rust1.90"
cxx-compiler = "g++-13"
extras = "all,tests"
job-script = "./.ci/test.sh.j2"
platform = "ubuntu-24.04"
python-build-type = "Release"
python-platform = "gh-ubuntu-26.04"
runs-on = "ubuntu-latest"

[[matrix.test.include]]
python-version = "3.11"

[[matrix.test.include]]
python-version = "3.12"

[[matrix.test.include]]
python-version = "3.13"

[package]
allow-stale-deps = true
ci-pre-commit = false
ci-schedule = "from-dependencies+19"
compiler-inputs = []
fork-pull-requests = false
full-history = true
name = "earthkit-hydro"
repo = "ecmwf/earthkit-hydro"
visibility = "public"

[[trigger-downstream]]
ref = "develop"
repo = "ecmwf/earthkit"
